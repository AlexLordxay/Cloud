<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планетарій</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Commissioner:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D scene; floating glass controls — top bar, info panel on the right (bottom sheet on phones), planet dock at the bottom. Single dark look by design. */
:root {
  --void: #04060c;
  --panel: rgba(10, 14, 26, 0.74);
  --panel-solid: #0c111f;
  --line: rgba(160, 182, 230, 0.16);
  --fg: #e9edf6;
  --muted: #8f9ab4;
  --sun: #f3b964;
  --ice: #9cc2ff;
  --font-display: "Unbounded", "Commissioner", system-ui, sans-serif;
  --font-body: "Commissioner", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--void);
  color: var(--fg);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.glass {
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

/* Top bar */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font: 600 18px/1.1 var(--font-display); letter-spacing: 0.02em; }
.brand span { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.controls {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px; border-radius: 999px;
}
.btn {
  border: 0; background: transparent; cursor: pointer;
  padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .2s;
}
.btn:hover { background: rgba(255,255,255,0.07); }
.btn[aria-pressed="true"] { background: rgba(243,185,100,0.16); color: var(--sun); }
.speed { display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.speed output { font-family: var(--font-mono); color: var(--fg); min-width: 3.2ch; font-variant-numeric: tabular-nums; }
.speed input { width: 90px; accent-color: var(--sun); }

/* Info panel */
.info {
  position: fixed; top: 86px; right: 16px; width: 340px; max-width: calc(100% - 32px);
  max-height: calc(100% - 86px - 110px - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; border-radius: var(--radius);
  padding: 22px 22px 18px;
  display: flex; flex-direction: column; gap: 16px;
}
.info > * { flex-shrink: 0; }
.kind { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--sun); }
.info h1 { margin: 4px 0 0; font: 600 30px/1.1 var(--font-display); text-wrap: balance; letter-spacing: 0.01em; }
.stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--panel-solid); padding: 10px 12px; min-width: 0; }
.stats dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.stats dd { margin: 3px 0 0; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats dd small { display: block; color: var(--muted); font-size: 11px; }
.desc { margin: 0; color: #c9d0e0; }
.fact { margin: 0; padding: 12px 14px; border-radius: 10px; background: rgba(156,194,255,0.08); border: 1px solid rgba(156,194,255,0.18); font-size: 14px; display: grid; gap: 4px; }
.fact span:first-child { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ice); }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.more { display: none; }

/* Dock */
.dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; align-items: center; gap: 4px;
  padding: 6px; border-radius: 999px;
  max-width: calc(100% - 32px);
}
.nav { border: 0; background: transparent; cursor: pointer; width: 38px; height: 38px; border-radius: 50%; flex: none; font-size: 20px; line-height: 1; }
.nav:hover { background: rgba(255,255,255,0.08); }
.chips { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; scroll-behavior: smooth; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 0; background: transparent; cursor: pointer; flex: none;
  padding: 8px 12px; border-radius: 999px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 7px; color: var(--muted);
  transition: background .2s, color .2s;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; display: block; box-shadow: 0 0 8px currentColor; }
.chip:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
.chip[aria-current="true"] { color: var(--void); background: var(--sun); }
.chip[aria-current="true"] i { box-shadow: none; }

/* Planet labels (overview) */
.tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  border: 0; background: transparent; padding: 2px 6px; border-radius: 6px;
  font-size: 11.5px; letter-spacing: 0.06em; color: rgba(233,237,246,0.82);
  white-space: nowrap; transition: opacity .3s, color .2s;
}
.tag:hover { color: var(--sun); }
.tags.off .tag { opacity: 0; pointer-events: none; }

/* Loader */
.loader {
  position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
  background: var(--void); transition: opacity .8s; z-index: 5;
}
.loader.done { opacity: 0; pointer-events: none; }
.loader b { font: 600 22px/1.2 var(--font-display); }
.loader span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.bar { width: 220px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 auto; }
.bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .2s; }

.error { max-width: 420px; padding: 0 16px; color: var(--muted); }

@media (max-width: 720px) {
  .brand span { display: none; }
  .speed input { width: 64px; }
  .btn { padding: 7px 10px; }
  .info {
    top: auto; right: 16px; left: 16px; width: auto; max-width: none;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    max-height: 52%;
    padding: 14px 16px; gap: 12px;
  }
  .info h1 { font-size: 22px; }
  .info-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .more {
    display: inline-flex; flex: none; border: 1px solid var(--line); background: transparent; cursor: pointer;
    border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--fg);
  }
  .info:not(.open) .collapsible { display: none; }
  .dock { left: 16px; right: 16px; transform: none; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .chips { scroll-behavior: auto; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Тривимірна модель Сонячної системи"></canvas>
<div class="tags" id="tags"></div>

<header class="topbar">
  <div class="brand"><b>Планетарій</b><span>Сонячна система в 3D</span></div>
  <div class="controls glass">
    <button class="btn" id="overview" type="button" aria-pressed="true">Огляд</button>
    <button class="btn" id="pause" type="button" aria-pressed="false">Пауза</button>
    <button class="btn" id="orbits" type="button" aria-pressed="true">Орбіти</button>
    <label class="speed" for="speed">Час <input id="speed" type="range" min="0" max="6" step="1" value="2"><output id="speedOut">×1</output></label>
  </div>
</header>

<aside class="info glass" id="info" aria-live="polite">
  <div class="info-head">
    <div>
      <p class="kind" id="kind"></p>
      <h1 id="name"></h1>
    </div>
    <button class="more" id="more" type="button" aria-expanded="false">Детальніше</button>
  </div>
  <dl class="stats collapsible" id="stats"></dl>
  <p class="desc collapsible" id="desc"></p>
  <p class="fact collapsible"><span>Цікавий факт</span><span id="fact"></span></p>
  <p class="hint collapsible">Тягніть, щоб обертати. Колесо миші або два пальці наближають. Стрілки ← → перемикають планети, Esc повертає до огляду.</p>
</aside>

<nav class="dock glass" aria-label="Планети">
  <button class="nav" id="prev" type="button" aria-label="Попереднє тіло">‹</button>
  <div class="chips" id="chips"></div>
  <button class="nav" id="next" type="button" aria-label="Наступне тіло">›</button>
</nav>

<div class="loader" id="loader">
  <b>Планетарій</b>
  <div class="bar"><i id="barFill"></i></div>
  <span id="loadText">Готуємо поверхні планет…</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

function mixInto(o, c, k) { o[0] += (c[0] - o[0]) * k; o[1] += (c[1] - o[1]) * k; o[2] += (c[2] - o[2]) * k; }
function shade(o, s) { o[0] *= s; o[1] *= s; o[2] *= s; }

function makeCraters(n, seed, minR, maxR) {
  let s = seed >>> 0;
  const rnd = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  const list = [];
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, t = rnd() * TAU, r = Math.sqrt(1 - u * u);
    list.push([r * Math.cos(t), u, r * Math.sin(t), minR + Math.pow(rnd(), 3) * (maxR - minR)]);
  }
  return list;
}
function craterShade(x, y, z, craters) {
  let s = 0;
  for (let i = 0; i < craters.length; i++) {
    const c = craters[i], dx = x - c[0], dy = y - c[1], dz = z - c[2], r = c[3];
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 > r * r * 1.8) continue;
    const t = Math.sqrt(d2) / r;
    if (t < 1) s -= 0.2 * (1 - t * t);
    const rim = (t - 1) / 0.16;
    s += 0.14 * Math.exp(-rim * rim);
  }
  return s;
}

function sphereTexture(w, h, fn) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(w, h), data = img.data;
  const o = [0, 0, 0, 255];
  let k = 0;
  for (let j = 0; j < h; j++) {
    const lat = PI / 2 - (j + 0.5) / h * PI, cl = Math.cos(lat), y = Math.sin(lat);
    for (let i = 0; i < w; i++) {
      const lon = (i + 0.5) / w * TAU;
      o[3] = 255;
      fn(cl * Math.cos(lon), y, cl * Math.sin(lon), lat, lon, o);
      data[k] = o[0]; data[k + 1] = o[1]; data[k + 2] = o[2]; data[k + 3] = o[3];
      k += 4;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}
function ringTexture(profile) {
  const w = 1024, h = 4, cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(w, h);
  for (let i = 0; i < w; i++) {
    const c = profile(i / (w - 1));
    for (let j = 0; j < h; j++) {
      const k = (j * w + i) * 4;
      img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = c[3];
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* ---------- Surface recipes ---------- */
const mercuryCraters = makeCraters(220, 7, 0.015, 0.16);
const moonCraters = makeCraters(160, 99, 0.015, 0.14);
const marsCraters = makeCraters(70, 31, 0.015, 0.09);

const RECIPES = {
  sun: [640, 320, (x, y, z, lat, lon, o) => {
    const n = fbm(x * 5, y * 5, z * 5, 1, 5);

    ramp([[0, [210, 70, 10]], [0.45, [250, 150, 40]], [0.7, [255, 205, 95]], [1, [255, 245, 210]]], n * 0.85 + g * 0.3 - 0.05, o);
  }],
  mercury: [640, 320, (x, y, z, lat, lon, o) => {
    const n = fbm(x * 3, y * 3, z * 3, 3, 5);
    const v = 0.42 + n * 0.35 + craterShade(x, y, z, mercuryCraters);

  }],
  venus: [640, 320, (x, y, z, lat, lon, o) => {

  }],
  earth: [1024, 512, (x, y, z, lat, lon, o) => {
    const h = fbm(x * 1.7 + 3.1, y * 1.7, z * 1.7, 11, 6);
    const alat = Math.abs(lat) / DEG;
    const sea = 0.515;
    if (h < sea) {
      ramp([[0, [5, 22, 60]], [0.7, [12, 50, 110]], [1, [34, 104, 158]]], smooth(0.36, sea, h), o);
    } else {
      const m = fbm(x * 3, y * 3, z * 3, 41, 3);

      o[0] = 58; o[1] = 100; o[2] = 46;

      mixInto(o, [198, 172, 118], desert);

    }

  }],
  earthClouds: [1024, 512, (x, y, z, lat, lon, o) => {
    const warp = fbm(x * 4, y * 4, z * 4, 61, 3);

  }],
  moon: [512, 256, (x, y, z, lat, lon, o) => {
    const maria = smooth(0.5, 0.62, fbm(x * 1.6, y * 1.6, z * 1.6, 81, 4));
    const n = fbm(x * 6, y * 6, z * 6, 83, 4);
    const v = 0.62 - maria * 0.22 + (n - 0.5) * 0.18 + craterShade(x, y, z, moonCraters);
    const t = clamp01(v) * 255;
    o[0] = o[1] = t; o[2] = t * 0.97;
  }],
  mars: [768, 384, (x, y, z, lat, lon, o) => {
    const n = fbm(x * 2.6, y * 2.6, z * 2.6, 21, 6);

    ramp([[0, [112, 44, 22]], [0.5, [184, 86, 44]], [1, [222, 140, 86]]], n * 1.4 - 0.15, o);
    mixInto(o, [84, 42, 28], dark * 0.55);
    shade(o, 1 + craterShade(x, y, z, marsCraters));
    const alat = Math.abs(lat) / DEG + (fbm(x * 5, y * 5, z * 5, 27, 3) - 0.5) * 10;

  jupiter: [1024, 512, (x, y, z, lat, lon, o) => {

    const b = Math.sin(y * 21 + (w - 0.5) * 3.2 + Math.sin(y * 7) * 0.8);
    const fine = noise3(x * 9, y * 46, z * 9, 33);
    ramp([[0, [150, 92, 60]], [0.35, [196, 140, 96]], [0.65, [226, 206, 176]], [1, [242, 232, 214]]], b * 0.45 + 0.5 + (fine - 0.5) * 0.25, o);
    const alat = Math.abs(lat) / DEG;

  }],
  uranus: [512, 256, (x, y, z, lat, lon, o) => {
    const b = Math.sin(y * 9 + (fbm(x * 2, y * 2, z * 2, 51, 3) - 0.5) * 1.2);

  neptune: [768, 384, (x, y, z, lat, lon, o) => {

    mixInto(o, [20, 34, 110], smooth(1, 0.3, e) * 0.85);
  }],
};

const saturnRing = t => {
  const fine = noise3(t * 190, 0.5, 0.5, 5) * 0.55 + noise3(t * 55, 0.3, 0.7, 6) * 0.45;
  let a, c;
  if (t < 0.28) { a = 0.22 + 0.2 * fine; c = [150, 136, 116]; }
  else if (t < 0.69) { a = 0.72 + 0.28 * fine; c = [228, 208, 168]; }
  else if (t < 0.77) { a = 0.05; c = [120, 110, 96]; }
  else { a = 0.5 + 0.28 * fine; c = [206, 190, 158]; if (Math.abs(t - 0.94) < 0.007) a = 0.04; }
  a *= smooth(0, 0.02, t) * (1 - smooth(0.985, 1, t));
  return [c[0], c[1], c[2], a * 255];
};
const uranusRing = t => {
  const lines = [0.05, 0.18, 0.3, 0.42, 0.55, 0.97];
  let a = 0;
  for (const l of lines) a = Math.max(a, Math.exp(-Math.pow((t - l) / 0.006, 2)));
  return [200, 215, 220, a * 150];
};

function toTexture(cv) {
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = maxAniso;
  return t;
}
function glowSprite(color, size, opacity) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 256;
  const g = cv.getContext("2d"), grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, `rgba(${color},1)`);
  grd.addColorStop(0.2, `rgba(${color},0.55)`);
  grd.addColorStop(0.5, `rgba(${color},0.12)`);
  grd.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: toTexture(cv), transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending }));
  s.scale.set(size, size, 1);
  return s;
}
function atmosphere(radius, rgb, power, strength) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { c: { value: new THREE.Color(rgb[0], rgb[1], rgb[2]) }, p: { value: power }, k: { value: strength } },
    vertexShader: "varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz; gl_Position = projectionMatrix * mv; }",
    fragmentShader: "uniform vec3 c; uniform float p; uniform float k; varying vec3 vN; varying vec3 vP; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), p); gl_FragColor = vec4(c, f * k); }",
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 48), mat);
}
function ringMesh(inner, outer, cv, tint) {
  const geo = new THREE.RingGeometry(inner, outer, 160, 1);
  const pos = geo.attributes.position, uv = geo.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5);
  }
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: toTexture(cv), color: tint, side: THREE.DoubleSide, transparent: true, depthWrite: false }));
  m.rotation.x = -PI / 2;
  return m;
}

// Starfield
(() => {
  const n = 7000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * TAU, r = Math.sqrt(1 - u * u), R = 1800 + Math.random() * 600;
    pos[i * 3] = r * Math.cos(t) * R; pos[i * 3 + 1] = u * R; pos[i * 3 + 2] = r * Math.sin(t) * R;
    const b = 0.35 + Math.pow(Math.random(), 3) * 0.65, tint = Math.random();
    col[i * 3] = b * (tint > 0.8 ? 1 : 0.85); col[i * 3 + 1] = b * 0.9; col[i * 3 + 2] = b * (tint < 0.3 ? 1 : 0.85);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true })));
})();

const orbitMats = [];
const pickables = [];
let earthClouds = null, moonPivot = null;

function buildBody(b, i, tex) {
  b.index = i;
  b.theta = Math.random() * TAU;
  b.omega = b.period ? (TAU / 40) / b.period : 0;
  b.group = new THREE.Group();
  b.tiltGroup = new THREE.Group();
  b.tiltGroup.rotation.z = b.tilt * DEG;
  b.group.add(b.tiltGroup);
  scene.add(b.group);

  const geo = new THREE.SphereGeometry(b.radius, 96, 64);
  let mat;
  if (b.id === "sun") {
    mat = new THREE.MeshBasicMaterial({ map: tex[b.id] });
    b.group.add(glowSprite("255,190,110", b.radius * 5.2, 0.9));
    b.group.add(glowSprite("255,150,70", b.radius * 11, 0.35));
  } else {
    const bumpy = b.id === "mercury" || b.id === "mars";
    mat = new THREE.MeshStandardMaterial({ map: tex[b.id], roughness: 1, metalness: 0, bumpMap: bumpy ? tex[b.id] : null, bumpScale: bumpy ? 0.04 : 0 });
  }
  b.mesh = new THREE.Mesh(geo, mat);
  b.mesh.userData.index = i;
  b.tiltGroup.add(b.mesh);
  pickables.push(b.mesh);

  if (b.atmo) b.tiltGroup.add(atmosphere(b.radius * 1.045, b.atmo, b.id === "venus" ? 2.2 : 3.0, b.id === "venus" ? 0.9 : 1.2));

  if (b.id === "earth") {
    earthClouds = new THREE.Mesh(new THREE.SphereGeometry(b.radius * 1.012, 96, 64), new THREE.MeshStandardMaterial({ map: tex.earthClouds, transparent: true, depthWrite: false, roughness: 1 }));
    b.tiltGroup.add(earthClouds);
    moonPivot = new THREE.Group();
    moonPivot.rotation.z = 5.1 * DEG;
    const moon = new THREE.Mesh(new THREE.SphereGeometry(0.46, 64, 48), new THREE.MeshStandardMaterial({ map: tex.moon, bumpMap: tex.moon, bumpScale: 0.03, roughness: 1 }));
    moon.position.x = 3.6;
    moonPivot.add(moon);
    b.group.add(moonPivot);
  }
  if (b.rings === "saturn") b.tiltGroup.add(ringMesh(b.radius * 1.24, b.radius * 2.27, ringTexture(saturnRing), 0xe6dccb));
  if (b.rings === "uranus") b.tiltGroup.add(ringMesh(b.radius * 1.6, b.radius * 2.05, ringTexture(uranusRing), 0xffffff));

  if (b.orbit) {
    const pts = [];
    for (let k = 0; k <= 256; k++) { const a = k / 256 * TAU; pts.push(new THREE.Vector3(Math.cos(a) * b.orbit, 0, -Math.sin(a) * b.orbit)); }
    const m = new THREE.LineBasicMaterial({ color: 0x9fb2d8, transparent: true, opacity: 0.16 });
    b.orbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), m);
    scene.add(b.orbitLine);
    orbitMats.push(m);
  }
  placeBody(b);
}
function placeBody(b) {
  b.group.position.set(Math.cos(b.theta) * b.orbit, 0, -Math.sin(b.theta) * b.orbit);
}

function fmtRatio(d) {
  const r = d / EARTH_D;
  const s = r >= 10 ? Math.round(r).toString() : r.toFixed(r < 1 ? 2 : 1).replace(".", ",");
  return `${s} × Землі`;
}
function renderInfo(data, body) {
  $("kind").textContent = data.kind;
  $("name").textContent = data.name;
  const rows = body ? [["Діаметр", data.d.toLocaleString("uk-UA") + " км", body.id === "earth" ? "еталон для порівняння" : fmtRatio(data.d)]].concat(body.id === "sun" ? data.stats.slice(1) : data.stats) : data.stats;
  $("stats").innerHTML = rows.map(r => `<div><dt>${r[0]}</dt><dd>${r[1]}${r[2] ? `<small>${r[2]}</small>` : ""}</dd></div>`).join("");
  $("desc").textContent = data.desc;

}

/* ---------- Camera state ---------- */
const state = { mode: "overview", index: -1, paused: reduceMotion, speed: 1, flight: null, orbits: true };
const Y = new THREE.Vector3(0, 1, 0);
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();

function overviewCam() {
  const aspect = innerWidth / innerHeight;
  const k = Math.max(1, 1.5 / aspect);
  return new THREE.Vector3(0, 150 * k, 235 * k);
}
function startFlight(getTarget, offset, dur, relBody) {
  controls.enabled = false;
  controls.minDistance = 0; controls.maxDistance = Infinity;
  state.flight = {
    t0: performance.now(), dur: reduceMotion ? 1 : dur,
    fromCam: camera.position.clone(), fromTgt: controls.target.clone(),
    getTarget, offset, relBody,
  };
}
function setActive(i) {
  BODIES.forEach((b, k) => {
    b.chip.setAttribute("aria-current", k === i ? "true" : "false");
    if (b.orbitLine) b.orbitLine.material.opacity = k === i ? 0.5 : 0.16;
  });
  if (i >= 0) BODIES[i].chip.scrollIntoView({ block: "nearest", inline: "center" });
  $("overview").setAttribute("aria-pressed", i < 0 ? "true" : "false");
  tagsEl.classList.toggle("off", i >= 0);
}
function focusBody(i) {
  i = (i + BODIES.length) % BODIES.length;
  const b = BODIES[i];
  state.mode = "focus"; state.index = i;
  const p = b.group.position;
  const dir = b.orbit ? p.clone().normalize() : new THREE.Vector3(0, 0, 1);
  const narrow = Math.max(1, 1.1 / (innerWidth / innerHeight));
  const dist = b.radius * (b.rings === "saturn" ? 5.6 : b.id === "sun" ? 3.4 : 4.4) * narrow;
  const offset = dir.multiplyScalar(-dist).applyAxisAngle(Y, b.id === "sun" ? 0 : 0.62);
  offset.y += dist * 0.26;
  if (!b.orbit) offset.set(0, dist * 0.3, dist);
  startFlight(() => b.group.position, offset, 1900, b);
  renderInfo(b, b);
  setActive(i);
}
function showOverview() {
  state.mode = "overview"; state.index = -1;
  startFlight(() => tmp2.set(0, 0, 0), overviewCam(), 2000, null);
  renderInfo(OVERVIEW, null);
  setActive(-1);
}

$("prev").addEventListener("click", () => focusBody(state.index < 0 ? BODIES.length - 1 : state.index - 1));
$("next").addEventListener("click", () => focusBody(state.index + 1));
$("overview").addEventListener("click", showOverview);
$("pause").addEventListener("click", () => {
  state.paused = !state.paused;
  $("pause").setAttribute("aria-pressed", String(state.paused));
  $("pause").textContent = state.paused ? "Далі" : "Пауза";
});
$("orbits").addEventListener("click", () => {
  state.orbits = !state.orbits;
  $("orbits").setAttribute("aria-pressed", String(state.orbits));
  BODIES.forEach(b => { if (b.orbitLine) b.orbitLine.visible = state.orbits; });
});
$("speed").addEventListener("input", e => {
  state.speed = SPEEDS[+e.target.value];
  $("speedOut").textContent = "×" + String(state.speed).replace(".", ",");
});
$("more").addEventListener("click", () => {
  const open = !infoEl.classList.contains("open");
  infoEl.classList.toggle("open", open);
  $("more").setAttribute("aria-expanded", String(open));
  $("more").textContent = open ? "Згорнути" : "Детальніше";
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") focusBody(state.index + 1);
  else if (e.key === "ArrowLeft") focusBody(state.index < 0 ? BODIES.length - 1 : state.index - 1);
  else if (e.key === "Escape") showOverview();
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); $("pause").click(); }
});
if (state.paused) { $("pause").setAttribute("aria-pressed", "true"); $("pause").textContent = "Далі"; }

// Click / tap a planet in space
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit && hit.object.userData.index !== state.index) focusBody(hit.object.userData.index);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const sdt = state.paused ? 0 : dt * state.speed;
  const cur = state.index >= 0 ? BODIES[state.index] : null;
  let curDTheta = 0;

  for (const b of BODIES) {
    if (b.orbit) {
      const d = b.omega * sdt;
      b.theta += d;
      if (b === cur) curDTheta = d;
      placeBody(b);
    }
    b.mesh.rotation.y += b.spin * sdt;
  }
  if (earthClouds) earthClouds.rotation.y += 0.02 * sdt;
  if (moonPivot) moonPivot.rotation.y += 0.45 * sdt;

  const f = state.flight;
  if (f) {
    if (f.relBody && curDTheta) f.offset.applyAxisAngle(Y, curDTheta);
    const t = clamp01((performance.now() - f.t0) / f.dur), e = ease(t);
    const target = f.getTarget();
    const endCam = tmp.copy(target).add(f.offset);
    controls.target.lerpVectors(f.fromTgt, target, e);
    camera.position.lerpVectors(f.fromCam, endCam, e);
    camera.position.y += Math.sin(PI * e) * Math.min(f.fromCam.distanceTo(endCam) * 0.12, 60);
    camera.lookAt(controls.target);
    if (t >= 1) {
      state.flight = null;
      controls.enabled = true;
      if (f.relBody) {
        controls.minDistance = f.relBody.radius * 1.5;
        controls.maxDistance = f.relBody.radius * 16;
      } else {
        controls.minDistance = 25; controls.maxDistance = 900;
      }
    }
  } else if (cur) {
    tmp.copy(camera.position).sub(controls.target).applyAxisAngle(Y, curDTheta);
    controls.target.copy(cur.group.position);
    camera.position.copy(controls.target).add(tmp);
  }
  if (!state.flight) controls.update();

  if (state.mode === "overview") {
    const w = innerWidth, h = innerHeight;
    for (const b of BODIES) {
      tmp.copy(b.group.position); tmp.y += b.radius + 1.2;
      tmp.project(camera);
      const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
      b.tag.style.visibility = vis ? "visible" : "hidden";
      if (vis) b.tag.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w}px, ${(-tmp.y * 0.5 + 0.5) * h}px) translate(-50%, -100%)`;
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------- Build (progressive, so the loader can update) ---------- */
const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
async function build() {
  const names = { sun: "Сонце", mercury: "Меркурій", venus: "Венера", earth: "Земля", earthClouds: "хмари Землі", moon: "Місяць", mars: "Марс", jupiter: "Юпітер", saturn: "Сатурн", uranus: "Уран", neptune: "Нептун" };
  const keys = Object.keys(RECIPES), tex = {};
  for (let i = 0; i < keys.length; i++) {
    $("loadText").textContent = `Малюємо поверхню: ${names[keys[i]]}`;
    $("barFill").style.width = `${(i / keys.length) * 100}%`;
    await frame();
    const [w, h, fn] = RECIPES[keys[i]];
    tex[keys[i]] = toTexture(sphereTexture(w, h, fn));
  }
  $("barFill").style.width = "100%";
  BODIES.forEach((b, i) => buildBody(b, i, tex));
  renderInfo(OVERVIEW, null);
  setActive(-1);

  const end = overviewCam();
  camera.position.set(end.x * 3.2, end.y * 1.6, end.z * 3.2);
  controls.target.set(0, 0, 0);
  camera.lookAt(0, 0, 0);
  await frame();
  loaderEl.classList.add("done");
  startFlight(() => tmp2.set(0, 0, 0), end, 3200, null);
  tick();
}
build();
})();
</script>
</body>
